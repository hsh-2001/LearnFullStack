<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .icon-box {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #c60909;
            border-radius: 50%;
        }

        .container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 1px solid #767676;
            transition: transform 0.3s ease-in-out;
        }

        .container:hover {
            transform: translateY(-10px);
        }

        .container .action-button {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .container .action-button button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .container:hover .action-button {
            display: flex;
        }
    </style>
</head>

<body>
    <h1>JUST TESTING</h1>
    <section>
        <div class="icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                style="fill: #c60909;">
                <path
                    d="M320-240 80-480l240-240 57 57-184 184 183 183-56 56Zm320 0-57-57 184-184-183-183 56-56 240 240-240 240Z" />
            </svg>
        </div>

        <div class="container">
            <div class="action-button">
                <button>Click Me</button>
            </div>
        </div>
    </section>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Form</title>
  <style>
  form {
    width: 300px;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #f3f3f3;
  }

  h4 {
    text-align: center;
    margin-bottom: 20px;
  }

  .form-group input:not([type="checkbox"]) {
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
  }

  .form-group input:not([type="checkbox"]) {
    padding: 8px;
    width: 90%;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  .form-group input:focus {
    border-color: #00fe3f;
    outline: none;
  }

  .form-group label {
    margin-bottom: 5px;
    font-weight: 400;
  }

  .form-group label[for="password"]::before,
  .form-group label[for="name"]::before {
    content: "*";
    margin-right: 5px;
    color: red;
  }
</style>
</head>
<body>
  <div style="width: 100%; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <form action="#">
      <h4>TESTING FORM</h4>
      <div class="form-group">
        <label for="name">Username:</label>
        <input type="text" id="name" name="name" placeholder="Enter your username" />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" />
      </div>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" inputmode="email" />
      </div>
      <div class="form-group">
        <label>Age:</label>
        <input type="number" inputmode="numeric" />
      </div>
      <div class="form-group">
        <label>Date of birth:</label>
        <input type="date" />
      </div>
      <div class="form-group">
        <label for="photo">Photo:</label>
        <input type="file" id="photo" accept="image/*" />r
      </div>
      <div class="form-group">
        <select id="test" name="test">
          <option value="" hidden>Select value</option>
          <option value="18">18</option>
          <option value="19" disabled>19</option>
          <option value="20">20</option>
          <option value="21">21</option>
          <option value="22">22</option>
          <option value="23">23</option>
        </select>
      </div>
  </div>
  </form>
  </div>
</body>

</html>

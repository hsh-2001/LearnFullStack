<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* using before */
        .hello::before {
            content: "**";
            margin-right: 5px;
            color: red;
            /* background-color: yellow; */
        }
        .hello::after {
            content: "🚾";
            margin-left: 5px;
            color: red;
        }

        .box {
            margin-top: 20px;
            width: 200px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: lightblue;
            border-radius: 10px;
            position: relative;
        }

        .box::before {
            content: "";
            width: 20px;
            height: 20px;
            background-color: red;
            position: absolute;
            top: -10px;
            font-size: 20px;
            color: white;
        }

        .profile {
            margin-top: 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #ededed;
            position: relative;
        }
        .profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile::after {
            content: "";
            position: absolute;
            bottom: 4px;
            right: 10px;
            background-color: #2ded13;
            border-radius: 50%;
            width: 15px;
            height: 15px;
        }

    </style>
</head>
<body>
    <h1>Learn Pseudo</h1>
    <!-- <div class="hello">Listening</div>

    <div class="box">
        <p>This is a box.</p>
    </div> -->

    <div class="profile">
        <img src="https://cdn-icons-png.flaticon.com/512/9203/9203764.png" alt="Profile Picture">
    </div>
</body>
</html>

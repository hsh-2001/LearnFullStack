<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Image tag</title>
</head>

<body>
    <h1>Image display:</h1>
    <br>
    <div>
        <!-- External image -->
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAdBUkL6CL9geDn8RcmxCtrjLzSIfL3seMFA&s"
            alt="Free Image" width="400" height="100">
    </div>
    <div>
        <!-- Internal/ Same folder -->
        <img src="./korea.png" alt="Internal Image" width="100" height="100">
    </div>
    <div>
        <!-- Internal/ Parent folder -->
        <img src="../assets/spain.png" alt="Internal Image" width="100" height="100" title="Spain Flag 100">
    </div>
    </div>
</body>

</html>
